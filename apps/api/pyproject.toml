[project]
name = "zoniq-api"
version = "0.1.0"
description = "API analiz dostępności transportowej zoniq"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "networkx>=3.4,<4",
  "osmnx>=2.0,<3",
  "pyrosm>=0.6,<1",
  "scipy>=1.14,<2",
  "uvicorn[standard]>=0.34,<1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
