services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ZONIQ_GTFS_DATABASE: /data/processed/ztm.sqlite
      ZONIQ_SIMULATION_DIRECTORY: /data/simulations
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
